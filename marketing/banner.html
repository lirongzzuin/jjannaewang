<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1932px; height: 828px; overflow: hidden; }
      body {
        font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
        background: #f8f8f5;
        position: relative;
      }
      /* soft amber blobs */
      .blob1 { position: absolute; width: 1100px; height: 1100px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,183,0,0.18), rgba(255,183,0,0) 70%);
        top: -260px; right: -200px; }
      .blob2 { position: absolute; width: 760px; height: 760px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255,183,0,0.14), rgba(255,183,0,0) 70%);
        bottom: -300px; left: 360px; }

      .wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center;
        gap: 90px; padding: 0 130px; }

      .iconCard { flex: none; width: 600px; height: 600px; border-radius: 130px;
        box-shadow: 0 40px 90px rgba(35,29,15,0.18); overflow: hidden; background: #fff; }
      .iconCard img { width: 100%; height: 100%; display: block; object-fit: cover; }

      .copy { flex: 1; }
      .pill { display: inline-flex; align-items: center; gap: 14px; background: #fff;
        border: 2px solid rgba(255,183,0,0.5); color: #231d0f; font-weight: 800;
        font-size: 40px; padding: 16px 30px; border-radius: 999px;
        box-shadow: 0 10px 24px rgba(35,29,15,0.06); }
      .pill .crown { font-size: 40px; }

      h1 { margin-top: 34px; font-size: 124px; line-height: 1.12; font-weight: 800;
        letter-spacing: -3px; color: #231d0f; }
      h1 .hl { color: #ffb700; }

      .sub { margin-top: 30px; font-size: 41px; line-height: 1.5; font-weight: 600; color: #5b5648; }

      .chips { margin-top: 46px; display: flex; gap: 22px; }
      .chip { font-size: 37px; font-weight: 800; padding: 18px 34px; border-radius: 999px;
        background: rgba(255,183,0,0.16); color: #8a6a00; }
    </style>
  </head>
  <body>
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="wrap">
      <div class="iconCard"><img src="./icon.png" alt="짠내왕" /></div>
      <div class="copy">
        <span class="pill"><span class="crown">👑</span> 짠내왕</span>
        <h1>최저가는<br /><span class="hl">짠내왕</span>이 지킨다</h1>
        <p class="sub">생수·기저귀·라면… 생활용품 최저가를 주식처럼 추적하고,<br />목표가에 도달하면 토스 알림으로 콕 집어 알려드려요.</p>
        <div class="chips">
          <span class="chip">📉 가격 추적</span>
          <span class="chip">🔔 목표가 알림</span>
          <span class="chip">🍯 절약 꿀팁</span>
        </div>
      </div>
    </div>
  </body>
</html>
